# Physical parameters of the Caddy AI2 robot
# Single source of truth: read by launch files and passed to Jinja2 templates
# for Gazebo SDF, controllers YAML, MVSim XML, and any future backends.

wheelbase: 1.65       # Distance between front and rear axles (m)
track_width: 0.91     # Distance between left and right wheel centers (m)
wheel_radius: 0.235   # Wheel radius (m)
max_steer_angle: 0.4  # Maximum steering angle, software command limit (rad)

# Fixed structural properties
wheel_width: 0.22               # Wheel width (m)
wheel_mass: 8.7                 # Mass of each wheel (kg)
height: 0.25                    # Body height used for inertia (m)
mass: 590                       # Total vehicle mass (kg)
vehicle_collision_width: 1.230  # Collision box width (m)
vehicle_collision_length: 2.660 # Collision box length (m)
vehicle_collision_height: 1.7   # Collision box height (m)
vehicle_collision_ground_clearance: 0.20  # Gap between ground and the collision box underside (m). 0 = box drags on the floor
vehicle_collision_offset_x: -0.25   # Collision box X offset from base (m)
inertial_origin_offset_x: -0.275    # Inertial origin X offset from base (m)

# Sensors — mounting pose relative to base_link (robot chassis center at wheel_radius height).
# Set enabled: false to exclude a sensor from the model without removing its entry.
# type: dispatches the render function in spawn_robot.launch.py
sensors:
  imu_sbg_ig500n:
    enabled: true
    type: imu
    package: caddy_ai2_ros2_control_sensors_sbg_ig_500n
    frame_id: imu_sbg_ig500n_link
    pose:                   # relative to base_link
      x: 0.825              # above front axle (wheelbase/2)
      y: 0.0
      z: 0.42               # 0.655m above ground - 0.235m wheel_radius
      roll: 0.0
      pitch: 0.0
      yaw: 0.0

  gps_sbg_ig500n:
    enabled: true
    type: gps
    package: caddy_ai2_ros2_control_sensors_sbg_ig_500n
    frame_id: gps_sbg_ig500n_link
    pose:                   # relative to base_link
      x: 1.10               # same as sick_lms_291, centered on top of it
      y: 0.0
      z: 0.129              # SICK aperture (0.22) + SICK body (0.134) + half GPS box (0.01) - wheel_radius (0.235)
      roll: 0.0
      pitch: 0.0
      yaw: 0.0

  lidar_2d_sick_lms_291:
    enabled: true
    type: lidar_2d
    package: caddy_ai2_ros2_sensors_sick_lms_291
    frame_id: lidar_2d_sick_lms_291_link
    pose:                   # relative to base_link — PROVISIONAL, measure on real vehicle
      x: 1.10               # just past the chassis front face (front at x=1.08 from base_link)
      y: 0.0
      z: -0.015             # laser aperture 0.22m above ground - 0.235m wheel_radius
      roll: 0.0
      pitch: 0.0
      yaw: 0.0

  lidar_3d_rs_helios_5515:
    enabled: true
    type: lidar_3d
    package: caddy_ai2_ros2_sensors_rs_helios_5515
    frame_id: lidar_3d_rs_helios_5515_link
    pose:                   # relative to base_link — PROVISIONAL, measure on real vehicle
      x: 0.0                # roof, centered
      y: 0.0
      z: 1.4                # sensor center; 1.4 m above base_link
      roll: 0.0
      pitch: 0.0
      yaw: 0.0

  # --- ZED 2i cameras on the top bar: layout study --------------------------------------------
  # Two layouts, enable ONE pair at a time (the other pair must stay enabled: false).
  # All poses are PROVISIONAL (bar position and height not measured yet).
  # Horizontal FOV H = 110 deg (2.1 mm lens). With outward yaw +-theta: overlap = H - 2*theta,
  # total coverage = H + 2*theta.
  #
  # Layout A — both forward, at the bar ends, yaw +-40 deg outward: 30 deg central overlap, 190 deg total.
  zed_2i_left:
    enabled: true
    type: camera_rgbd
    package: caddy_ai2_ros2_camera_zed_2i
    frame_id: zed_2i_left_link
    pose:                   # relative to base_link
      x: 0.6
      y: 0.5
      z: 1.45
      roll: 0.0
      pitch: 0.0
      yaw: 0.698            # 40 deg, to the left

  zed_2i_right:
    enabled: true
    type: camera_rgbd
    package: caddy_ai2_ros2_camera_zed_2i
    frame_id: zed_2i_right_link
    pose:
      x: 0.6
      y: -0.5
      z: 1.45
      roll: 0.0
      pitch: 0.0
      yaw: -0.698           # 40 deg, to the right

  # Layout B — one forward, one backward, both centered: 2 x 110 deg, no overlap, 2 x 70 deg blind at the sides.
  zed_2i_front:
    enabled: false
    type: camera_rgbd
    package: caddy_ai2_ros2_camera_zed_2i
    frame_id: zed_2i_front_link
    pose:
      x: 0.6
      y: 0.0
      z: 1.45
      roll: 0.0
      pitch: 0.0
      yaw: 0.0

  zed_2i_rear:
    enabled: false
    type: camera_rgbd
    package: caddy_ai2_ros2_camera_zed_2i
    frame_id: zed_2i_rear_link
    pose:
      x: 0.6
      y: 0.0
      z: 1.45
      roll: 0.0
      pitch: 0.0
      yaw: 3.14159          # facing backwards

  imu_vn100:
    enabled: true
    type: imu               # IMU + magnetometer + barometer (topics vectornav/{imu,magnetic,pressure})
    package: caddy_ai2_ros2_imu_vectornav_vn100
    frame_id: imu_vn100_link   # keep in sync with frame_id in the real driver (config/vn100.yaml)
    pose:                   # relative to base_link — PROVISIONAL, measure on real vehicle
      x: 0.40
      y: 0.0
      z: 0.42
      roll: 0.0
      pitch: 0.0
      yaw: 0.0
