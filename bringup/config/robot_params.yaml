# Physical parameters of the Caddy AI2 robot
# Single source of truth: read by launch files and passed to Jinja2 templates
# for Gazebo SDF, controllers YAML, MVSim XML, and any future backends.

wheelbase: 1.65       # Distance between front and rear axles (m)
track_width: 0.91     # Distance between left and right wheel centers (m)
wheel_radius: 0.235   # Wheel radius (m)
max_steer_angle: 0.4  # Maximum steering angle, software command limit (rad)

# Fixed structural properties
wheel_width: 0.22               # Wheel width (m)
wheel_mass: 8.7                 # Mass of each wheel (kg)
height: 0.25                    # Body height used for inertia (m)
mass: 590                       # Total vehicle mass (kg)
vehicle_collision_width: 1.230  # Collision box width (m)
vehicle_collision_length: 2.660 # Collision box length (m)
vehicle_collision_height: 1.7   # Collision box height (m)
vehicle_collision_offset_x: -0.25   # Collision box X offset from base (m)
inertial_origin_offset_x: -0.275    # Inertial origin X offset from base (m)

# Sensors — mounting pose relative to base_link (robot chassis center at wheel_radius height).
# Set enabled: false to exclude a sensor from the model without removing its entry.
# type: dispatches the render function in spawn_robot.launch.py
sensors:
  imu_sbg_ig500n:
    enabled: true
    type: imu
    package: caddy_ai2_ros2_control_sensors_sbg_ig_500n
    frame_id: imu_sbg_ig500n_link
    pose:                   # relative to base_link
      x: 0.825              # above front axle (wheelbase/2)
      y: 0.0
      z: 0.42               # 0.655m above ground - 0.235m wheel_radius
      roll: 0.0
      pitch: 0.0
      yaw: 0.0

  gps_sbg_ig500n:
    enabled: true
    type: gps
    package: caddy_ai2_ros2_control_sensors_sbg_ig_500n
    frame_id: gps_sbg_ig500n_link
    pose:                   # relative to base_link
      x: 1.10               # same as sick_lms_291, centered on top of it
      y: 0.0
      z: 0.559              # SICK aperture (0.415) + SICK body height (0.134) + half GPS box (0.01)
      roll: 0.0
      pitch: 0.0
      yaw: 0.0

  lidar_2d_sick_lms_291:
    enabled: true
    type: lidar_2d
    package: caddy_ai2_ros2_sensors_lidar_sick_lms_291
    frame_id: lidar_2d_sick_lms_291_link
    pose:                   # relative to base_link — PROVISIONAL, measure on real vehicle
      x: 1.10               # just past the chassis front face (front at x=1.08 from base_link)
      y: 0.0
      z: 0.415              # laser aperture 0.65m above ground - 0.235m wheel_radius
      roll: 0.0
      pitch: 0.0
      yaw: 0.0

  lidar_2d_ydlidar_x4:
    enabled: true
    type: lidar_2d
    package: caddy_ai2_ros2_sensors_ydlidar_x4
    frame_id: lidar_2d_ydlidar_x4_link
    pose:                   # relative to base_link — PROVISIONAL, measure on real vehicle
      x: -0.825             # rear area, above rear axle
      y: 0.0
      z: 1.165              # 1.4m above ground - 0.235m wheel_radius
      roll: 0.0
      pitch: 0.0
      yaw: 3.14159          # rotated 180° — scans towards rear
